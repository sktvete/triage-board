<meta charset="utf-8">
<title>Triage — Space Rush Feedback</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triage">
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151d;
    --panel2: #181c26;
    --border: #262b38;
    --border-soft: #1c2029;
    --text: #e4e7ee;
    --muted: #8891a3;
    --muted-dim: #5b6274;
    --accent: #4f8cff;
    --accent-dim: #2c4a8a;
    --bug: #ff5d5d;
    --feature: #35d9a8;
    --low: #6b7386;
    --medium: #f5b942;
    --high: #ff5d5d;
  }
  :root[data-theme="light"] {
    --bg: #f3f4f7;
    --panel: #ffffff;
    --panel2: #f7f8fb;
    --border: #dde1ea;
    --border-soft: #e7e9f0;
    --text: #1a1d27;
    --muted: #656d80;
    --muted-dim: #9aa1b0;
    --accent: #2f66d0;
    --accent-dim: #cfe0ff;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f4f7;
      --panel: #ffffff;
      --panel2: #f7f8fb;
      --border: #dde1ea;
      --border-soft: #e7e9f0;
      --text: #1a1d27;
      --muted: #656d80;
      --muted-dim: #9aa1b0;
      --accent: #2f66d0;
      --accent-dim: #cfe0ff;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }

  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    position: sticky; top: 0; background: var(--bg); z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; flex-shrink: 0; }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    display: inline-block; box-shadow: 0 0 0 3px var(--accent-dim);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 12px; }
  .toolbar { display: flex; gap: 8px; flex: 1; flex-wrap: wrap; align-items: center; min-width: 0; }
  input[type=text], select {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 7px 10px; font-size: 13px; font-family: inherit;
  }
  input[type=text]:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  input[type=text]#search { min-width: 160px; flex: 1; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer;
  }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }

  .status-strip {
    display: flex; gap: 16px; padding: 8px 18px; font-size: 11px; color: var(--muted);
    border-bottom: 1px solid var(--border-soft); flex-wrap: wrap;
  }
  .status-strip b { color: var(--text); font-variant-numeric: tabular-nums; }

  .chip {
    padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; font-family: ui-monospace, monospace;
  }
  .chip.bug { background: color-mix(in srgb, var(--bug) 16%, transparent); color: var(--bug); }
  .chip.feature { background: color-mix(in srgb, var(--feature) 16%, transparent); color: var(--feature); }
  .prio-select {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .04em; font-family: ui-monospace, monospace;
  }
  .prio-select[data-p="high"] { color: var(--high); border-color: color-mix(in srgb, var(--high) 40%, var(--border)); }
  .prio-select[data-p="medium"] { color: var(--medium); border-color: color-mix(in srgb, var(--medium) 40%, var(--border)); }
  .prio-select[data-p="low"] { color: var(--low); }

  main { padding: 16px 18px 40px; display: flex; gap: 14px; overflow-x: auto; align-items: flex-start; }
  .column {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    min-width: 290px; flex: 1; max-width: 330px; display: flex; flex-direction: column;
    max-height: calc(100vh - 130px);
  }
  .column-head {
    padding: 11px 13px; border-bottom: 1px solid var(--border-soft); font-size: 12px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .column-head .count {
    background: var(--panel2); padding: 1px 7px; border-radius: 999px; font-size: 10px;
    font-family: ui-monospace, monospace; color: var(--text);
  }
  .cards { padding: 9px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .card {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 11px 9px; cursor: grab; transition: border-color .15s, transform .1s;
    border-left: 3px solid var(--muted-dim);
  }
  .card[data-type="bug"] { border-left-color: var(--bug); }
  .card[data-type="feature"] { border-left-color: var(--feature); }
  .card:hover { border-color: var(--accent); }
  .card.dragging { opacity: .4; }
  .card-title { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; }
  .card-desc {
    font-size: 12px; color: var(--muted); line-height: 1.4;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; margin-bottom: 8px;
  }
  .card-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .card-log {
    font-size: 10px; color: var(--muted-dim); font-family: ui-monospace, monospace;
    margin-bottom: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-actions { display: flex; gap: 6px; }
  .card-actions button { padding: 4px 9px; font-size: 11px; }
  .move-select {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 4px 9px; font-size: 11px; font-family: inherit; cursor: pointer;
  }
  .empty { color: var(--muted-dim); font-size: 12px; padding: 22px 10px; text-align: center; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px; width: 460px; max-width: 92vw; max-height: 85vh; overflow-y: auto;
  }
  dialog::backdrop { background: rgba(4,6,10,.6); backdrop-filter: blur(2px); }
  dialog label {
    display: block; font-size: 10px; color: var(--muted); margin: 14px 0 4px;
    text-transform: uppercase; letter-spacing: .05em; font-weight: 600;
  }
  dialog textarea {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 8px 10px; font-size: 12px; font-family: ui-monospace, monospace;
    resize: vertical; min-height: 70px;
  }
  .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  #detailBody img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; }

  .banner {
    display: none; padding: 10px 18px; font-size: 13px;
    background: color-mix(in srgb, var(--bug) 12%, var(--bg));
    color: var(--bug); border-bottom: 1px solid color-mix(in srgb, var(--bug) 30%, var(--border));
  }

  /* ---- Mobile status tabs (segmented control, hidden on desktop) ---- */
  .tabs {
    display: none;
    gap: 6px; padding: 10px 14px; overflow-x: auto;
    border-bottom: 1px solid var(--border-soft);
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 600;
    -webkit-tap-highlight-color: transparent;
  }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab .n {
    font-family: ui-monospace, monospace; font-size: 11px; opacity: .8;
    background: rgba(127,127,127,.2); border-radius: 999px; padding: 0 6px;
  }
  .tab.active .n { background: rgba(255,255,255,.25); }

  @media (max-width: 640px) {
    html { -webkit-text-size-adjust: 100%; }
    body { padding-bottom: env(safe-area-inset-bottom); }
    header {
      padding: max(12px, env(safe-area-inset-top)) 14px 10px;
      gap: 10px;
    }
    .brand { width: 100%; justify-content: space-between; }
    #refreshBtn { order: -1; }
    .toolbar { width: 100%; order: 2; }
    input[type=text]#search { width: 100%; font-size: 16px; padding: 10px 12px; }
    select { font-size: 15px; padding: 9px 11px; flex: 1; }
    .status-strip { display: none; }
    .tabs { display: flex; position: sticky; top: 0; background: var(--bg); z-index: 15; }

    main {
      display: block; padding: 12px 14px calc(28px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }
    .column {
      display: none;
      min-width: 0; max-width: none; max-height: none;
      background: transparent; border: none; border-radius: 0;
    }
    .column.mobile-active { display: flex; }
    .column-head { display: none; }
    .cards { padding: 0; overflow-y: visible; gap: 10px; }

    .card { padding: 14px 15px 12px; border-radius: 12px; border-left-width: 4px; }
    .card-title { font-size: 15px; }
    .card-desc { font-size: 13.5px; }
    .card-log { font-size: 10.5px; white-space: normal; }
    .card-meta { margin-bottom: 10px; }
    .chip { padding: 4px 9px; font-size: 10.5px; }
    .prio-select { padding: 5px 8px; font-size: 11px; min-height: 30px; }
    .card-actions button, .move-select {
      flex: 1; padding: 10px 0; font-size: 13px; font-weight: 600; border-radius: 8px;
      min-height: 40px; text-align: center;
    }

    dialog {
      width: 100%; max-width: 100%; height: 100%; max-height: 100%;
      margin: 0; border-radius: 0; padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
      border: none;
    }
    dialog[open] { display: flex; flex-direction: column; }
    #detailBody { flex: 1; }
    .dialog-actions { position: sticky; bottom: 0; background: var(--panel); padding-top: 10px; }
    .dialog-actions button { flex: 1; min-height: 46px; font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>Triage</h1>
    <span class="subtitle mono">Space Rush feedback</span>
  </div>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Search title or message…">
    <select id="typeFilter">
      <option value="">All types</option>
      <option value="bug">Bugs</option>
      <option value="feature">Features</option>
    </select>
    <select id="prioFilter">
      <option value="">All priorities</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </div>
  <button id="refreshBtn" class="ghost">↻ Refresh</button>
</header>

<div class="status-strip mono">
  <span>reports: <b id="statTotal">–</b></span>
  <span>bugs: <b id="statBugs">–</b></span>
  <span>features: <b id="statFeatures">–</b></span>
  <span id="statUpdated">–</span>
</div>

<div id="banner" class="banner"></div>

<div id="tabs" class="tabs"></div>

<main id="board"></main>

<dialog id="dlg">
  <div id="detailBody"></div>
  <div class="dialog-actions">
    <button type="button" class="ghost" id="closeBtn">Close</button>
  </div>
</dialog>

<script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
<script>
const CONTAINER_ID = "iCloud.com.sindretvete.spacerush";
const API_TOKEN = "776a03c5c5ed20dbc16280f2d061fb120ce02751687d515999ca66d7a37d9c91";
const STATE_KEY = "triage-local-state-v1";

const COLUMNS = [
  { id: "backlog",   label: "Backlog" },
  { id: "reviewing", label: "Reviewing" },
  { id: "accepted",  label: "Accepted" },
  { id: "rejected",  label: "Rejected" },
];

let items = [];
let loadError = null;

function loadLocalState() {
  try { return JSON.parse(localStorage.getItem(STATE_KEY) || "{}"); } catch { return {}; }
}
function saveLocalState(state) {
  localStorage.setItem(STATE_KEY, JSON.stringify(state));
}

function fieldVal(fields, key, fallback) {
  return fields[key] && fields[key].value !== undefined ? fields[key].value : fallback;
}

async function loadItems() {
  try {
    CloudKit.configure({
      containers: [{
        containerIdentifier: CONTAINER_ID,
        apiTokenAuth: { apiToken: API_TOKEN, persist: false },
        environment: "development",
      }],
    });
    const db = CloudKit.getDefaultContainer().publicCloudDatabase;
    const res = await db.performQuery({ recordType: "Feedback" });
    const state = loadLocalState();
    items = res.records.map(r => {
      const f = r.fields;
      const local = state[r.recordName] || {};
      const attachment = f.attachment && f.attachment.value;
      return {
        id: r.recordName,
        type: (fieldVal(f, "kind", "bug") || "bug").toLowerCase(),
        title: fieldVal(f, "title", "(untitled)"),
        desc: fieldVal(f, "message", ""),
        diagnostics: fieldVal(f, "diagnostics", ""),
        appVersion: fieldVal(f, "appVersion", ""),
        device: fieldVal(f, "deviceModel", ""),
        system: fieldVal(f, "systemVersion", ""),
        player: fieldVal(f, "playerName", ""),
        created: fieldVal(f, "createdAt", null),
        screenshotUrl: attachment ? attachment.downloadURL : null,
        status: local.status || "backlog",
        priority: local.priority || "medium",
      };
    });
    items.sort((a, b) => (b.created || 0) - (a.created || 0));
    loadError = null;
  } catch (e) {
    loadError = (e && e.message) || String(e);
    items = [];
  }
  render();
}

function patchLocal(id, patch) {
  const state = loadLocalState();
  state[id] = { ...state[id], ...patch };
  saveLocalState(state);
}

const board = document.getElementById("board");
const search = document.getElementById("search");
const typeFilter = document.getElementById("typeFilter");
const prioFilter = document.getElementById("prioFilter");
const dlg = document.getElementById("dlg");
const banner = document.getElementById("banner");
const tabsEl = document.getElementById("tabs");
let mobileStatus = "backlog";

function filtered() {
  const q = search.value.trim().toLowerCase();
  const t = typeFilter.value;
  const p = prioFilter.value;
  return items.filter(it =>
    (!q || it.title.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q)) &&
    (!t || it.type === t) &&
    (!p || it.priority === p)
  );
}

function updateStats() {
  document.getElementById("statTotal").textContent = items.length;
  document.getElementById("statBugs").textContent = items.filter(i => i.type === "bug").length;
  document.getElementById("statFeatures").textContent = items.filter(i => i.type === "feature").length;
  document.getElementById("statUpdated").textContent = "updated " + new Date().toLocaleTimeString();
}

function render() {
  if (loadError) {
    banner.style.display = "block";
    banner.textContent = `Couldn't load feedback from CloudKit: ${loadError}`;
  } else {
    banner.style.display = "none";
  }
  updateStats();
  board.innerHTML = "";
  const list = filtered();

  tabsEl.innerHTML = "";
  for (const col of COLUMNS) {
    const n = list.filter(it => it.status === col.id).length;
    const tab = document.createElement("button");
    tab.className = "tab" + (col.id === mobileStatus ? " active" : "");
    tab.innerHTML = `${col.label} <span class="n">${n}</span>`;
    tab.addEventListener("click", () => { mobileStatus = col.id; render(); });
    tabsEl.appendChild(tab);
  }

  for (const col of COLUMNS) {
    const colItems = list.filter(it => it.status === col.id);
    const colEl = document.createElement("div");
    colEl.className = "column" + (col.id === mobileStatus ? " mobile-active" : "");
    colEl.dataset.status = col.id;
    colEl.innerHTML = `
      <div class="column-head"><span>${col.label}</span><span class="count">${colItems.length}</span></div>
      <div class="cards" data-status="${col.id}"></div>
    `;
    const cardsEl = colEl.querySelector(".cards");
    if (!colItems.length) cardsEl.innerHTML = `<div class="empty">No items</div>`;
    for (const it of colItems) cardsEl.appendChild(renderCard(it, col.id));
    addDropHandlers(cardsEl);
    board.appendChild(colEl);
  }
}

function renderCard(it, colId) {
  const card = document.createElement("div");
  card.className = "card";
  card.draggable = true;
  card.dataset.id = it.id;
  card.dataset.type = it.type;
  const when = it.created ? new Date(it.created).toLocaleDateString() : "—";
  card.innerHTML = `
    <div class="card-title">${escapeHtml(it.title)}</div>
    <div class="card-desc">${escapeHtml(it.desc)}</div>
    <div class="card-log">${escapeHtml(it.device)} · iOS ${escapeHtml(it.system)} · ${when}</div>
    <div class="card-meta">
      <span class="chip ${it.type}">${it.type}</span>
      <select class="prio-select" data-p="${it.priority}" data-act="priority">
        <option value="high" ${it.priority === "high" ? "selected" : ""}>High</option>
        <option value="medium" ${it.priority === "medium" ? "selected" : ""}>Medium</option>
        <option value="low" ${it.priority === "low" ? "selected" : ""}>Low</option>
      </select>
    </div>
    <div class="card-actions">
      <button class="ghost" data-act="view">Details</button>
      <select class="move-select" data-act="move">
        <option value="" disabled selected>Move to…</option>
        ${COLUMNS.filter(c => c.id !== colId).map(c => `<option value="${c.id}">${c.label}</option>`).join("")}
      </select>
    </div>
  `;
  card.addEventListener("dragstart", () => card.classList.add("dragging"));
  card.addEventListener("dragend", () => card.classList.remove("dragging"));
  card.querySelector('[data-act="view"]').addEventListener("click", () => openDetail(it.id));
  card.querySelector('[data-act="priority"]').addEventListener("change", (e) => {
    it.priority = e.target.value;
    patchLocal(it.id, { priority: it.priority });
    render();
  });
  card.querySelector('[data-act="move"]').addEventListener("change", (e) => {
    it.status = e.target.value;
    patchLocal(it.id, { status: it.status });
    render();
  });
  return card;
}

function addDropHandlers(cardsEl) {
  cardsEl.addEventListener("dragover", e => e.preventDefault());
  cardsEl.addEventListener("drop", e => {
    e.preventDefault();
    const dragging = document.querySelector(".card.dragging");
    if (!dragging) return;
    const it = items.find(x => x.id === dragging.dataset.id);
    it.status = cardsEl.dataset.status;
    patchLocal(it.id, { status: it.status });
    render();
  });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function openDetail(id) {
  const it = items.find(x => x.id === id);
  document.getElementById("detailBody").innerHTML = `
    <h2 style="margin:0 0 6px;font-size:16px;">${escapeHtml(it.title)}</h2>
    <div style="display:flex;gap:6px;margin-bottom:4px;">
      <span class="chip ${it.type}">${it.type}</span>
      <span class="mono" style="font-size:11px;color:var(--muted);align-self:center;">${it.priority} priority</span>
    </div>
    <div style="font-size:13px;line-height:1.55;white-space:pre-wrap;margin-top:10px;">${escapeHtml(it.desc)}</div>
    ${it.screenshotUrl ? `<label>Screenshot</label><img src="${it.screenshotUrl}" alt="Screenshot">` : ""}
    ${it.diagnostics ? `<label>Diagnostics</label><textarea readonly style="min-height:110px;">${escapeHtml(it.diagnostics)}</textarea>` : ""}
    <label>Device</label>
    <div class="mono" style="font-size:12px;color:var(--muted);">${escapeHtml(it.device) || "unknown"} · iOS ${escapeHtml(it.system)} · app v${escapeHtml(it.appVersion)}</div>
    ${it.player ? `<label>Player</label><div class="mono" style="font-size:12px;color:var(--muted);">${escapeHtml(it.player)}</div>` : ""}
    <label>Submitted</label>
    <div class="mono" style="font-size:12px;color:var(--muted);">${it.created ? new Date(it.created).toLocaleString() : "unknown"}</div>
  `;
  dlg.showModal();
}

document.getElementById("closeBtn").addEventListener("click", () => dlg.close());
document.getElementById("refreshBtn").addEventListener("click", () => loadItems());
[search, typeFilter, prioFilter].forEach(el => el.addEventListener("input", render));

loadItems();
</script>
